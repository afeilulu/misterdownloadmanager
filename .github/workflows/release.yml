# Builds the Windows (x64) release: installer (setup.exe), portable zip, and standard zip.
# - A pushed tag vX.Y.Z (matching Cargo.toml's version) publishes a GitHub release with them.
# - Run by hand (Actions -> Release -> Run workflow) it only builds and keeps them as artifacts.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: windows-x64
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: IP-to-country table
        run: python tools/geo/build.py --release

      - name: Toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add x86_64-pc-windows-msvc

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ runner.os }}-x86_64-pc-windows-msvc-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: release-${{ runner.os }}-x86_64-pc-windows-msvc-cargo-

      - name: Tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $v = [regex]::Match((Get-Content Cargo.toml -Raw), '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} but Cargo.toml says $v" }

      # BoringSSL, under the browser-like connection (#668, crates/engine/src/browserlike.rs), and
      # AWS-LC are built with NASM for x64 Windows; the runner has CMake and LLVM's libclang already.
      - name: NASM
        shell: pwsh
        run: |
          choco install nasm --version 2.16.3 --no-progress -y
          "C:\Program Files\NASM" >> $env:GITHUB_PATH

      - name: Tests
        run: cargo test --workspace

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Code-signing certificate
        id: cert
        shell: pwsh
        env:
          PFX: ${{ secrets.CODESIGN_PFX_BASE64 }}
          PASSWORD: ${{ secrets.CODESIGN_PASSWORD }}
        run: |
          if (-not $env:PFX) { "No certificate: building unsigned."; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          "command=`"$($signtool.FullName)`" sign /fd sha256 /tr http://timestamp.digicert.com /td sha256 /f `"$pfx`" /p `"$env:PASSWORD`" `$f" >> $env:GITHUB_OUTPUT

      - name: Installer and portable zip
        shell: pwsh
        env:
          MDM_SIGN_COMMAND: ${{ steps.cert.outputs.command }}
        run: ./tools/installer/build.ps1 -Arch x64

      # The programs on the machine that built them: for this processor, and a download works.
      - name: Smoke test
        run: python tools/installer/smoke.py target/x86_64-pc-windows-msvc/release x64

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-x64
          path: target/dist/*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: extension
          path: |
            target/extension/mdm-chromium.zip
            target/extension/mdm-firefox.xpi
            target/extension/mdm-chrome-store.zip

  publish:
    permissions:
      contents: write # the release
      actions: write # rebuilding the website
      issues: read # the release notes' Thanks to (tools/contributors.py)
      pull-requests: read
      id-token: write # build provenance: signs the attestation (Sigstore, keyless)
      attestations: write # build provenance: stores it on the repository
    if: >-
      always() && startsWith(github.ref, 'refs/tags/') && needs.windows.result == 'success'
    needs: [windows]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-x64
          path: dist

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/MisterDownloadManager-*

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          MDM_RELEASE_KEY: ${{ secrets.MDM_RELEASE_KEY }}
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          foreach ($f in "setup.exe", "portable.zip", "x64.zip") {
            if (-not (Test-Path "dist/MisterDownloadManager-$v-$f")) { throw "x64 Windows' $f isn't there: no release" }
          }
          Remove-Item dist/SHA256SUMS*.txt -ErrorAction SilentlyContinue
          $files = Get-ChildItem dist -File | Sort-Object Name
          $sums = $files | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" }
          Set-Content -Encoding ascii dist/SHA256SUMS.txt $sums
          if ($env:MDM_RELEASE_KEY) {
            $key = Join-Path $env:RUNNER_TEMP "mdm-release.asc"
            Set-Content -Encoding ascii $key $env:MDM_RELEASE_KEY
            gpg --batch --quiet --import $key
            Remove-Item $key
            gpg --batch --yes --detach-sign --local-user 5826D399249DE856EA087D802E293C28E8A69D74 `
              --output dist/SHA256SUMS.txt.sig dist/SHA256SUMS.txt
            if ($LASTEXITCODE) { throw "signing SHA256SUMS.txt failed" }
            gpg --batch --verify dist/SHA256SUMS.txt.sig dist/SHA256SUMS.txt
            if ($LASTEXITCODE) { throw "the signature of SHA256SUMS.txt doesn't verify" }
          } else {
            Write-Warning "MDM_RELEASE_KEY isn't set: this release is unsigned, and MDM won't update to it by itself."
          }
          $v = "${{ github.ref_name }}".TrimStart("v")
          $log = Get-Content CHANGELOG.md -Raw -ErrorAction SilentlyContinue
          $m = [regex]::Match("$log", "(?ms)^## \[$([regex]::Escape($v))\][^\n]*\n(.*?)(?=^## |\z)")
          $title = "Mister Download Manager ${{ github.ref_name }}"
          $thanks = ""
          try {
            $thanks = (python tools/contributors.py thanks "${{ github.ref_name }}" | Out-String).Trim()
          } catch {
            Write-Warning "The contributors couldn't be listed: $_"
          }
          if ($thanks) { $thanks = "`n`n" + $thanks }
          $all = (Get-ChildItem dist -File).FullName
          if ($m.Success -and $m.Groups[1].Value.Trim()) {
            $notes = $m.Groups[1].Value.Trim() -replace '\]\((?![a-z]+:|#)([^)\s]+)\)', '](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/$1)'
            Set-Content -Encoding utf8 notes.md ($notes + $thanks)
            gh release create "${{ github.ref_name }}" --latest --title $title --notes-file notes.md $all
          } else {
            Set-Content -Encoding utf8 notes.md ($thanks.Trim())
            gh release create "${{ github.ref_name }}" --latest --title $title --notes-file notes.md --generate-notes $all
          }
          try {
            gh workflow run pages.yml --ref main
          } catch {
            Write-Warning "pages.yml trigger skipped: $_"
          }
