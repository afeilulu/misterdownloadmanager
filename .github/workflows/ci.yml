# Build, lint and test on windows-latest.
name: CI

# Pushes to main only: a pull request's branch is tested once as the pull request (a bare push:
# ran everything twice), and a release tag's commit was already tested on main.
# A change to the website or the docs alone builds nothing here (the app embeds none of it; the
# Website workflow builds the site). The app's own catalogs, i18n/*.tsv, still run everything.
on:
  push:
    branches: [main]
    paths-ignore:
      - "website/**"
      - "tools/website/**"
      - "i18n/site/**"
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "website/**"
      - "tools/website/**"
      - "i18n/site/**"
      - "docs/**"
      - "**/*.md"
  # Actions -> CI -> Run workflow
  workflow_dispatch:

# A newer commit on a pull request makes its older run moot: cancel it (main runs to the end).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: windows-latest
    runs-on: windows-latest
    # A cold build takes about 10 minutes; a hung runner is cut off instead of running to GitHub's 6 hours.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cargo-

      # BoringSSL, under the browser-like connection (#668, crates/engine/src/browserlike.rs),
      # and AWS-LC are built with NASM on x64 Windows; the runner has CMake and LLVM's
      # libclang already.
      - name: NASM
        shell: pwsh
        run: |
          choco install nasm --version 2.16.3 --no-progress -y
          "C:\Program Files\NASM" >> $env:GITHUB_PATH

      - name: Format
        run: cargo fmt --all --check

      # A text added to the code without running tools/i18n/extract.py fails here; missing
      # translations don't (they show in English until tools/i18n/translate.py runs).
      - name: English catalog matches the code
        run: |
          python tools/i18n/extract.py
          git diff --exit-code -- i18n/en.tsv

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

  # A translator's reviewed rows (no "#, machine" line) must survive every pull request: no
  # tool or merge may drop them or hand them back to machine translation.
  translations:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Reviewed translations kept
        run: python tools/i18n/reviewed_guard.py --base "origin/${{ github.base_ref }}"

  extension:
    name: browser extension
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Logic against fake Firefox and Chrome APIs
        run: node tools/extension/test.mjs

      # The committed locale files are the catalogs' output: a text added to English's
      # messages.json without translate.py, or a catalog fix not regenerated, shows here,
      # like "English catalog matches the code" does for i18n/en.tsv.
      - name: Locale files match the catalogs
        run: |
          python tools/extension/locales.py
          git diff --exit-code -- extension/_locales

      # Chrome, Edge, Brave, Opera, Vivaldi (mdm-chromium.zip), Firefox (mdm-firefox.xpi) and
      # the Chrome Web Store's copy (mdm-chrome-store.zip).
      - name: Pack for every browser
        shell: pwsh
        run: ./tools/extension/pack.ps1

      - name: Check the packages
        run: node tools/extension/check-pack.mjs

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: extension
          path: |
            target/extension/mdm-chromium.zip
            target/extension/mdm-firefox.xpi
            target/extension/mdm-chrome-store.zip
